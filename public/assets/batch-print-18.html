<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파보겔 어제·오늘 18개처 전체 일괄 인쇄 센터 (포스터 / 주소라벨 / 배송명세서)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }

  body {
    font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: #0f172a;
    color: #0f172a;
  }

  /* 상단 내비게이션 & 컨트롤 바 */
  .top-control-bar {
    position: sticky;
    top: 0;
    z-index: 9999;
    background: #090d16;
    border-bottom: 2px solid #0284c7;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    padding: 14px 24px;
    color: #ffffff;
  }
  .top-bar-inner {
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .top-title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .top-badge {
    background: linear-gradient(135deg, #0284c7, #2563eb);
    color: #ffffff;
    font-size: 11px;
    font-weight: 900;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .top-main-title {
    font-size: 18px;
    font-weight: 900;
    color: #f8fafc;
    letter-spacing: -0.5px;
  }
  .top-sub-title {
    font-size: 12px;
    color: #94a3b8;
  }

  /* 모드 전환 탭 버튼 */
  .mode-tabs {
    display: flex;
    background: #1e293b;
    padding: 4px;
    border-radius: 12px;
    gap: 4px;
    border: 1px solid #334155;
  }
  .mode-btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 800;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mode-btn:hover {
    color: #ffffff;
    background: rgba(255,255,255,0.05);
  }
  .mode-btn.active {
    background: #0284c7;
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4);
  }

  /* 액션 버튼 그룹 */
  .action-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-print-primary {
    background: linear-gradient(135deg, #e11d48, #be123c);
    color: #ffffff;
    border: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(225, 29, 72, 0.4);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn-print-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(225, 29, 72, 0.6);
  }
  .btn-viewer-link {
    background: #334155;
    color: #cbd5e1;
    border: 1px solid #475569;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn-viewer-link:hover {
    background: #475569;
    color: #ffffff;
  }

  /* 프리뷰 컨테이너 */
  .preview-wrapper {
    background: #1e293b;
    min-height: calc(100vh - 80px);
    padding: 30px 20px 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .mode-guide {
    max-width: 1000px;
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    color: #e2e8f0;
    font-size: 13px;
  }
  .mode-guide b {
    color: #38bdf8;
  }

  /* ======================================================== */
  /* [모드 1] A4 알림판 포스터 18장 스타일                    */
  /* ======================================================== */
  .posters-container {
    display: flex;
    flex-direction: column;
    gap: 30px;
    align-items: center;
  }

  .a4-page {
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    background: #ffffff;
    padding: 10mm 13mm 10mm 13mm;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    page-break-after: always;
    page-break-inside: avoid;
    border-radius: 4px;
  }

  .top-store-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 10px;
    border-left: 5px solid #0284c7;
    margin-bottom: 4px;
  }
  .store-tag {
    font-size: 11px;
    color: #38bdf8;
    font-weight: 800;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .store-main-name {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #ffffff;
  }
  .store-order-badge {
    font-size: 11px;
    background: rgba(56, 189, 248, 0.2);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.4);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }

  .header-wrap {
    text-align: center;
    margin-top: 2px;
  }
  .vet-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #0284c7;
    color: #ffffff;
    font-size: 10px;
    font-weight: 900;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
  }
  .main-heading {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.25;
    letter-spacing: -1.2px;
    color: #0f172a;
    margin-top: 6px;
  }
  .highlight-red {
    color: #dc2626;
  }
  .sub-heading {
    font-size: 12.5px;
    color: #475569;
    margin-top: 3px;
    font-weight: 500;
  }
  .sub-heading b {
    color: #0284c7;
    font-weight: 800;
  }

  .symptom-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 2px;
  }
  .symptom-card {
    background: #fff1f2;
    border: 1px solid #fecdd3;
    border-radius: 8px;
    padding: 5px 3px;
    text-align: center;
  }
  .symptom-icon {
    font-size: 16px;
    line-height: 1;
  }
  .symptom-name {
    font-size: 11px;
    font-weight: 800;
    color: #be123c;
    margin-top: 2px;
  }

  .banner-wrap {
    margin-top: 2px;
  }
  .banner-badge {
    font-size: 9.5px;
    font-weight: 800;
    color: #0284c7;
    text-align: center;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .banner-box {
    background: linear-gradient(135deg, #002b90 0%, #004bbf 60%, #0284c7 100%);
    border-radius: 10px;
    padding: 8px 16px;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 12px rgba(0, 43, 144, 0.25);
  }
  .banner-desc {
    font-size: 10.5px;
    color: #bae6fd;
    font-weight: 600;
  }
  .banner-product-title {
    font-size: 17px;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.3px;
  }
  .banner-price-label {
    font-size: 9.5px;
    background: rgba(255,255,255,0.2);
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 700;
  }
  .banner-price-val {
    font-size: 24px;
    font-weight: 900;
    font-family: 'Montserrat', sans-serif;
    color: #fbbf24;
    letter-spacing: -0.5px;
  }
  .banner-price-won {
    font-size: 13px;
    font-weight: 700;
    color: #fef3c7;
    margin-left: 2px;
  }

  .body-grid {
    display: grid;
    grid-template-columns: 195px 1fr;
    gap: 12px;
    margin-top: 3px;
    align-items: stretch;
  }
  .left-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bottle-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 6px 4px 5px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 165px;
  }
  .bottle-img-wrap {
    width: 100%;
    height: 135px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bottle-img {
    max-width: 135px;
    max-height: 135px;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  .bottle-caption {
    font-size: 9.5px;
    font-weight: 800;
    color: #0369a1;
    margin-top: 2px;
  }

  .safe-care-card {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: 10px;
    padding: 8px 10px;
  }
  .safe-header {
    font-size: 9.5px;
    font-weight: 900;
    color: #15803d;
    margin-bottom: 5px;
    text-align: center;
    letter-spacing: 0.3px;
  }
  .safe-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .safe-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: #166534;
    line-height: 1.25;
  }
  .safe-item-icon {
    font-size: 11px;
    flex-shrink: 0;
  }

  .right-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ingredients-card {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 8px 12px;
  }
  .card-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 3px;
  }
  .card-header-title {
    font-size: 11px;
    font-weight: 900;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-header-badge {
    font-size: 9px;
    font-weight: 800;
    background: #e0f2fe;
    color: #0369a1;
    padding: 1px 6px;
    border-radius: 4px;
  }

  .ingredient-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px 8px;
  }
  .ingredient-item {
    display: flex;
    align-items: flex-start;
    gap: 6px;
  }
  .num-circle {
    width: 15px;
    height: 15px;
    background: #0284c7;
    color: #ffffff;
    font-size: 9px;
    font-weight: 900;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .ing-title {
    font-size: 10.5px;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.2;
  }
  .ing-desc {
    font-size: 9px;
    color: #64748b;
    line-height: 1.2;
    margin-top: 1px;
  }

  .clinical-card {
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 10px;
    padding: 7px 12px;
  }
  .clinical-badge {
    font-size: 8.5px;
    font-weight: 800;
    background: #0d9488;
    color: #ffffff;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .clinical-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 8px;
    margin-top: 4px;
  }
  .clinical-item {
    font-size: 9.5px;
    color: #115e59;
    display: flex;
    align-items: flex-start;
    gap: 4px;
    line-height: 1.25;
  }
  .clinical-check {
    color: #0d9488;
    font-weight: 900;
  }

  .dosage-card {
    background: #fffbeb;
    border: 1.5px solid #fde68a;
    border-radius: 10px;
    padding: 7px 12px;
  }
  .dosage-badge {
    font-size: 8.5px;
    font-weight: 800;
    background: #d97706;
    color: #ffffff;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .dosage-content {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 4px;
  }
  .info-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 10.5px;
  }
  .info-pill {
    background: #fef3c7;
    color: #92400e;
    font-size: 9px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .info-val {
    color: #78350f;
    font-weight: 700;
  }
  .shake-tip {
    font-size: 9px;
    color: #b45309;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 3px;
    margin-top: 1px;
  }

  .desk-banner {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2px;
  }
  .desk-title {
    font-size: 11px;
    font-weight: 800;
    color: #1e293b;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .desk-sub {
    font-size: 9.5px;
    color: #64748b;
    margin-top: 1px;
  }
  .desk-btn {
    background: #0284c7;
    color: #ffffff;
    border: none;
    font-size: 9.5px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .footer-wrap {
    border-top: 1.5px solid #e2e8f0;
    padding-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2px;
  }
  .footer-left {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    max-width: 440px;
  }
  .footer-check {
    color: #0284c7;
    font-size: 14px;
    font-weight: 900;
    line-height: 1;
    margin-top: 2px;
  }
  .footer-text {
    font-size: 11px;
    color: #334155;
    line-height: 1.4;
  }
  .footer-store {
    font-weight: 900;
    color: #0f172a;
    font-size: 12px;
  }
  .footer-tel {
    font-weight: 800;
    color: #0284c7;
    font-size: 11.5px;
  }

  .qr-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1.5px solid #38bdf8;
    border-radius: 8px;
    padding: 3px 8px 3px 4px;
    flex-shrink: 0;
  }
  .qr-img {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }
  .qr-label-group {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .qr-badge {
    background: #03c75a;
    color: #ffffff;
    font-size: 7.5px;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 2px;
    width: fit-content;
  }
  .qr-label-main {
    font-size: 10px;
    font-weight: 900;
    color: #002b90;
  }
  .qr-label-sub {
    font-size: 8px;
    font-weight: 700;
    color: #0284c7;
  }

  .color-bar {
    height: 4px;
    background: linear-gradient(90deg, #002b90 0%, #0284c7 50%, #38bdf8 100%);
    border-radius: 2px;
    margin-top: 4px;
  }

  /* ======================================================== */
  /* [모드 2] 택배 주소 라벨 스티커 스타일 (A4 규격 인쇄)     */
  /* ======================================================== */
  .labels-container {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
  }
  .labels-a4-sheet {
    width: 210mm;
    min-height: 297mm;
    background: #ffffff;
    padding: 12mm 10mm;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    page-break-after: always;
    page-break-inside: avoid;
    border-radius: 4px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 44mm;
    gap: 4mm 5mm;
  }
  .shipping-label-card {
    border: 1.5px solid #0f172a;
    border-radius: 6px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .label-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1.5px solid #0f172a;
    padding-bottom: 4px;
  }
  .label-badge-box {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .label-post-badge {
    background: #e11d48;
    color: #ffffff;
    font-size: 9px;
    font-weight: 900;
    padding: 1.5px 5px;
    border-radius: 3px;
  }
  .label-sample-badge {
    background: #0284c7;
    color: #ffffff;
    font-size: 9px;
    font-weight: 900;
    padding: 1.5px 5px;
    border-radius: 3px;
  }
  .label-order-num {
    font-size: 10px;
    font-weight: 900;
    color: #475569;
    font-family: 'Montserrat', sans-serif;
  }

  .label-body {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: 4px 0;
  }
  .label-receiver-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .label-receiver-name {
    font-size: 14.5px;
    font-weight: 900;
    color: #0f172a;
  }
  .label-store-name {
    font-size: 11px;
    font-weight: 800;
    color: #0369a1;
  }
  .label-phone {
    font-size: 12px;
    font-weight: 900;
    color: #0f172a;
    letter-spacing: -0.2px;
  }
  .label-address {
    font-size: 11px;
    color: #1e293b;
    line-height: 1.3;
    font-weight: 600;
  }

  .label-footer {
    border-top: 1px dashed #94a3b8;
    padding-top: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 8.5px;
    color: #64748b;
  }
  .label-sender {
    font-weight: 700;
    color: #475569;
  }
  .label-qty-tag {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #0f172a;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 900;
  }

  /* ======================================================== */
  /* [모드 3] 배송 관리 명단표 스타일 (A4 1장 컴팩트)          */
  /* ======================================================== */
  .table-container {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  .table-a4-sheet {
    width: 210mm;
    min-height: 297mm;
    background: #ffffff;
    padding: 14mm 12mm;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    page-break-after: always;
    page-break-inside: avoid;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
  }
  .table-header-block {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 2.5px solid #0f172a;
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .table-title {
    font-size: 18px;
    font-weight: 900;
    color: #0f172a;
  }
  .table-sub {

          </div>
        </div>

    </div>

    <!-- 데스크 문의 배너 -->

    <!-- 하단 취급처 & QR 코드 -->

    <!-- 최하단 시그니처 바 -->
    <div class="color-bar"></div>
  </article>
  `;
}

// 라벨 스티커 1개 카드 HTML 생성 함수
function renderLabelCard(item) {
  var no = item.no;
  var storeName = item.store || item.receiver;
  var receiver = item.receiver;
  var phone = item.phone || '';
  var address = item.address || '';
  var qty = item.qty || 1;
  var note = item.note || '';

  return `
  <div class="shipping-label-card">
    <div class="label-card-header">
      <div class="label-badge-box">
        <span class="label-post-badge">우체국/택배</span>
        <span class="label-sample-badge">파보겔 무료체험</span>
      </div>
      <span class="label-order-num">NO. ${String(no).padStart(2, '0')} / 18</span>
    </div>

    <div class="label-body">
      <div class="label-receiver-row">
        <div>
          <span class="label-receiver-name">${receiver}</span>
          <span style="font-size:10.5px; color:#64748b;"> 님 귀하</span>
        </div>
        <span class="label-store-name">[${storeName}]</span>
      </div>

      <div class="label-phone">☎ ${phone}</div>
      <div class="label-address">🏠 ${address}</div>
    </div>

    <div class="label-footer">
      <div class="label-sender">
        보내는분: (주)한국아그로 파보겔 사업부 (031-297-6200)
      </div>
      <div class="label-qty-tag">
        수량: ${qty}병 (동봉안내서 포함)
      </div>
    </div>
  </div>
  `;
}

// 초기 렌더링
function initRender() {
  // 1. 포스터 18장 렌더링
  var postersContainer = document.getElementById('view-posters');
  var postersHtml = '';
  for (var i = 0; i < ordersData.length; i++) {
    postersHtml += renderPosterCard(ordersData[i]);
  }
  postersContainer.innerHTML = postersHtml;

  // 2. 라벨 18개 렌더링 (A4 1장에 8장씩 -> 총 3장 시트)
  var labelsContainer = document.getElementById('view-labels');
  var labelsHtml = '';
  var pageSize = 8; // 한 페이지당 8장 (2열 4행)
  for (var p = 0; p < ordersData.length; p += pageSize) {
    var chunk = ordersData.slice(p, p + pageSize);
    labelsHtml += '<div class="labels-a4-sheet">';
    for (var j = 0; j < chunk.length; j++) {
      labelsHtml += renderLabelCard(chunk[j]);
    }
    // 빈 칸 채우기 (정렬 유지)
    for (var k = chunk.length; k < pageSize; k++) {
      labelsHtml += '<div class="shipping-label-card" style="border:1px dashed #cbd5e1; opacity:0.3; justify-content:center; align-items:center; color:#94a3b8; font-size:11px;">여백 라벨</div>';
    }
    labelsHtml += '</div>';
  }
  labelsContainer.innerHTML = labelsHtml;

  // 3. 관리 명단표 렌더링 (A4 1장 컴팩트)
  var tableContainer = document.getElementById('view-table');
  var rowsHtml = '';
  for (var t = 0; t < ordersData.length; t++) {
    var it = ordersData[t];
    rowsHtml += `
    <tr>
      <td class="col-no">${it.no}</td>
      <td class="col-store">${it.store}</td>
      <td class="col-receiver">${it.receiver}</td>
      <td class="col-phone">${it.phone}</td>
      <td class="col-address">${it.address}</td>
      <td class="col-qty">${it.qty}병</td>
      <td class="col-check">□ 완료</td>
    </tr>
    `;
  }
  var tableHtml = `
  <div class="table-a4-sheet">
    <div class="table-header-block">
      <div>
        <h2 class="table-title">파보겔 어제·오늘 3차 접수 18개처 배송 & 포스터 출고 관리대장</h2>
        <p class="table-sub">(주)한국아그로 마케팅본부 · 펫샵/브리더 무료체험 본품 및 맞춤 안내판 발송</p>
      </div>
      <div class="table-meta">
        <div>총 발송처: <b>18개소</b></div>
        <div>총 수량: <b>20병</b> (프리미엄펫 3병 외 각 1병)</div>
        <div>출력일자: 2026-10-27</div>
      </div>
    </div>

    <table class="orders-table">
      <thead>
        <tr>
          <th>NO</th>
          <th>상호명</th>
          <th>수령인</th>
          <th>연락처</th>
          <th>배송지 주소</th>
          <th>수량</th>
          <th>확인</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>

    <div style="margin-top:auto; padding-top:12px; border-top:1px solid #cbd5e1; display:flex; justify-content:space-between; font-size:10px; color:#64748b;">
      <span>※ 발송 박스마다 [매장 맞춤 A4 알림판 포스터 1부] + [파보겔 본품] 동봉 필수</span>
      <span>출고 담당자: __________________ (인)</span>
    </div>
  </div>
  `;
  tableContainer.innerHTML = tableHtml;
}

// 모드 전환 함수
function switchMode(mode) {
  var viewPosters = document.getElementById('view-posters');
  var viewLabels = document.getElementById('view-labels');
  var viewTable = document.getElementById('view-table');

  var tabPosters = document.getElementById('tab-posters');
  var tabLabels = document.getElementById('tab-labels');
  var tabTable = document.getElementById('tab-table');

  var guideText = document.getElementById('guide-text');

  // 리셋
  viewPosters.style.display = 'none';
  viewLabels.style.display = 'none';
  viewTable.style.display = 'none';

  tabPosters.classList.remove('active');
  tabLabels.classList.remove('active');
  tabTable.classList.remove('active');

  if (mode === 'posters') {
    viewPosters.style.display = 'flex';
    tabPosters.classList.add('active');
    guideText.innerHTML = '💡 <b>현재 선택: [🏪 A4 맞춤 포스터 18장 모드]</b> — 인쇄 버튼(Ctrl+P)을 누르면 1번 스타켄넬부터 18번 루미퍼피까지 <b>18장의 맞춤 알림판이 1장씩 순서대로 일괄 연속 출력</b>됩니다.';
  } else if (mode === 'labels') {
    viewLabels.style.display = 'flex';
    tabLabels.classList.add('active');
    guideText.innerHTML = '💡 <b>현재 선택: [📦 택배 주소 라벨 스티커 모드]</b> — A4 1장에 8칸씩(총 3장), 18개 매장의 <b>우체국/택배 발송용 주소 라벨 스티커</b>가 인쇄됩니다.';
  } else if (mode === 'table') {
    viewTable.style.display = 'flex';
    tabTable.classList.add('active');
    guideText.innerHTML = '💡 <b>현재 선택: [📋 배송 관리 명단표 모드]</b> — 어제·오늘 접수된 18곳의 <b>배송 주소 및 출고 체크리스트가 A4 단 1장</b>으로 컴팩트하게 인쇄됩니다.';
  }
}

window.addEventListener('DOMContentLoaded', initRender);
</script>

</html>
