name: Marketing Factory Daily Run

on:
  schedule:
    # 매일 아침 7시(UTC 22시)에 실행
    - cron: "0 22 * * *"
  workflow_dispatch:
    # GitHub UI에서 수동 실행 가능

jobs:
  run-marketing-factory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv requests-oauthlib

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Create .env from GitHub Secrets
        run: |
          cat << 'EOF' > marketing_factory/.env
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY=${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET=${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN=${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET=${{ secrets.TWITTER_ACCESS_SECRET }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_APP_ID=${{ secrets.META_APP_ID }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_IG_ACCOUNT_ID=${{ secrets.META_IG_ACCOUNT_ID }}
          EOF

      - name: Run Marketing Factory
        working-directory: marketing_factory
        run: |
          python core/marketing_master.py

      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-output-${{ github.run_number }}
          path: marketing_factory/output/
          retention-days: 7

      - name: Upload draft artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-drafts-${{ github.run_number }}
          path: marketing_factory/drafts/
          retention-days: 7
