name: Build Signed Android AAB & APK (ParvoGel PetCare VIP)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'apps/parvogel-petcare-vip/**'
      - '.github/workflows/build-android-apps.yml'

jobs:
  build-parvogel-android:
    name: Build ParvoGel PetCare VIP (.aab + .apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify preinstalled Android SDK & accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Write app .env & build Vite web bundle + Capacitor sync
        working-directory: apps/parvogel-petcare-vip
        run: |
          cat << 'EOF' > .env
          VITE_FIREBASE_API_KEY=AIzaSyABY27Ewxikgja2rmCT7Nekvvare9-H2f0
          VITE_FIREBASE_AUTH_DOMAIN=parvogel-petcare-vip.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=parvogel-petcare-vip
          VITE_FIREBASE_STORAGE_BUCKET=parvogel-petcare-vip.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=417386225420
          VITE_FIREBASE_APP_ID=1:417386225420:web:27fa8fd64b38c511363329
          EOF
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build
          npx cap sync android

      - name: Prepare ParvoGel Upload Keystore from GitHub Secrets
        id: keystore
        env:
          SECRET_B64: ${{ secrets.PARVOGEL_KEYSTORE_BASE64 }}
          SECRET_PW: ${{ secrets.PARVOGEL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SECRET_B64" ] || [ -z "$SECRET_PW" ]; then
            echo "::error::PARVOGEL_KEYSTORE_BASE64 or PARVOGEL_KEYSTORE_PASSWORD secret is missing!"
            exit 1
          fi
          KEYSTORE_DIR="$RUNNER_TEMP/keystores/parvogel-petcare-vip"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_FILE="$KEYSTORE_DIR/parvogel-petcare-vip-upload.jks"
          echo "$SECRET_B64" | base64 --decode > "$KEYSTORE_FILE"
          echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$SECRET_PW"
          echo "keystore_pw=$SECRET_PW" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release AAB & Release APK with Gradle
        working-directory: apps/parvogel-petcare-vip/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.keystore_pw }}
          ANDROID_KEY_ALIAS: parvogel_vip
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.keystore_pw }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          mkdir -p "$RUNNER_TEMP/release-out/parvogel-petcare-vip"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release-out/parvogel-petcare-vip/parvogel-petcare-vip-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release-out/parvogel-petcare-vip/parvogel-petcare-vip-release.apk"
          ls -lh "$RUNNER_TEMP/release-out/parvogel-petcare-vip"

      - name: Upload Signed ParvoGel Android Artifacts (.aab + .apk)
        uses: actions/upload-artifact@v4
        with:
          name: parvogel-petcare-vip-android-release
          path: ${{ runner.temp }}/release-out/parvogel-petcare-vip/*
          retention-days: 30
