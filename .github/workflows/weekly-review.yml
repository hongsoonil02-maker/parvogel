name: ParvoGel Weekly Marketing Review

on:
  schedule:
    # 매주 일요일 밤 9시 KST (UTC 12:00) 자동 실행 — 해당 주(월~일) 마케팅 성과 집계 및 Discord 발송
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      last_week:
        description: "직전 주(월~일) 기준으로 집계 (--last-week)"
        required: false
        default: false
        type: boolean
      no_notify:
        description: "Discord/Slack 웹훅 알림 없이 리포트 파일만 생성 (--no-notify)"
        required: false
        default: false
        type: boolean

jobs:
  weekly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Restore latest Marketing Factory publish ledger cache
        uses: actions/cache@v4
        with:
          path: marketing_factory/data/published_ledger.json
          key: weekly-review-ledger-${{ github.run_id }}
          restore-keys: |
            marketing-ledger-
            weekly-review-ledger-

      - name: Generate Weekly Report & Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INPUT_LAST_WEEK: ${{ inputs.last_week }}
          INPUT_NO_NOTIFY: ${{ inputs.no_notify }}
        run: |
          ARGS=""
          if [ "$INPUT_LAST_WEEK" = "true" ]; then
            ARGS="$ARGS --last-week"
          fi
          if [ "$INPUT_NO_NOTIFY" = "true" ]; then
            ARGS="$ARGS --no-notify"
          fi
          python marketing_factory/core/weekly_review.py $ARGS

      - name: Upload Weekly Report Artifacts (MD / HTML / JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parvogel-weekly-report-${{ github.run_number }}
          path: marketing_factory/reports/
          retention-days: 30
