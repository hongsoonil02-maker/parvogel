<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파보겔 네이버 블로그 스마트 에디터 원클릭 복사 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --naver-green: #03C75A;
      --naver-dark: #029f48;
      --coupang-red: #E61E2B;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .header {
      max-width: 900px;
      width: 100%;
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: rgba(3, 199, 90, 0.15);
      color: var(--naver-green);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(3, 199, 90, 0.3);
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--subtext);
      font-size: 1rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card);
      border-radius: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.75rem;
      background: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .theme-select {
      background: #0f172a;
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.25rem;
      border-radius: 0.625rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-naver {
      background: var(--naver-green);
      color: #fff;
    }

    .btn-naver:hover {
      background: var(--naver-dark);
      transform: translateY(-1px);
    }

    .btn-naver:active {
      transform: translateY(0);
    }

    .btn-open {
      background: #334155;
      color: #f8fafc;
      text-decoration: none;
    }

    .btn-open:hover {
      background: #475569;
    }

    .editor-preview {
      padding: 2.5rem;
      background: #ffffff;
      color: #222222;
      line-height: 1.85;
      font-size: 1.05rem;
      overflow-y: auto;
      max-height: 680px;
    }

    /* 네이버 블로그 스마트에디터 스타일 완벽 재현 */
    .nb-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #111;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      letter-spacing: -0.03em;
      border-bottom: 2px solid #eee;
      padding-bottom: 1rem;
    }

    .nb-h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #03C75A;
      margin-top: 2rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nb-quote {
      background: #f8fafc;
      border-left: 4px solid #03C75A;
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 0.5rem 0.5rem 0;
      font-size: 1.02rem;
      color: #334155;
      font-style: normal;
    }

    .nb-media-placeholder {
      background: #f1f5f9;
      border: 2px dashed #94a3b8;
      border-radius: 0.75rem;
      padding: 2rem;
      text-align: center;
      color: #475569;
      font-weight: 700;
      margin: 1.5rem 0;
    }

    .nb-cta-box {
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 1rem;
      padding: 1.75rem;
      margin: 2rem 0;
    }

    .nb-cta-btn {
      display: block;
      background: #03C75A;
      color: #ffffff !important;
      text-align: center;
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 800;
      font-size: 1.15rem;
      text-decoration: none;
      margin-top: 1rem;
    }

    .nb-coupang-btn {
      display: block;
      background: #E61E2B;
      color: #ffffff !important;
      text-align: center;
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 800;
      font-size: 1.15rem;
      text-decoration: none;
      margin-top: 0.5rem;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      background: #03C75A;
      color: #fff;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      font-weight: 700;
      box-shadow: 0 10px 25px -5px rgba(3, 199, 90, 0.5);
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">NAVER BLOG AUTO-FORMATTER</div>
    <h1 class="title">파보겔 네이버 블로그 상위노출 원클릭 스튜디오</h1>
    <p class="subtitle">네이버 스마트에디터 ONE 서식과 100% 일치하도록 서식 복사하여 1초 만에 포스팅하세요.</p>
  </div>

  <div class="container">
    <div class="action-bar">
      <select class="theme-select" id="themeSelect" onchange="loadSelectedTheme()">
        <option value="tuesday">화요일 테마: 주사기 거부견 1초 펌프 급여</option>
        <option value="monday">월요일 테마: 55일령 아기 강아지 급성 장염 골든타임</option>
        <option value="wednesday">수요일 테마: 안락사 위기 0.6kg 아기 푸들의 자가 기립</option>
        <option value="thursday">목요일 테마: 장 점막 물리적 코팅 및 DNJ 메커니즘</option>
        <option value="friday">금요일 테마: 3일 만에 그릇까지 핥아먹은 폭풍 식욕</option>
        <option value="saturday">토요일 테마: 쓰러진 아기의 7일 완치 퇴원 감동 실화</option>
      </select>

      <div class="btn-group">
        <button class="btn btn-naver" onclick="copyFormattedBlog()">
          📋 스마트에디터 서식 원클릭 복사
        </button>
        <a href="https://section.blog.naver.com/" target="_blank" class="btn btn-open" title="네이버 블로그 홈에서 [글쓰기]를 클릭하세요">
          ✏️ 네이버 블로그 열기 (글쓰기)
        </a>
      </div>
    </div>

    <div class="editor-preview" id="blogPreview">
      <!-- 동적 콘텐츠 로드 -->
    </div>
  </div>

  <div class="toast" id="toastMsg">✅ 서식이 클립보드에 복사되었습니다! 네이버 블로그에 Ctrl+V 하세요.</div>

  <script>
    const THEMES = {
      tuesday: {
        title: "주사기 거부하는 강아지, 입가에 대고 1초만 누르세요 (스트레스 제로 급여)",
        p1: "급성 장염과 심한 설사로 탈진해 쓰러진 아기 강아지, 억지로 가루약을 물에 타 먹이려다 거품을 물고 거부할 때 보호자의 가슴은 무너져 내립니다.",
        doctor: "하남 사랑동물병원 김동준 원장: '내원 당시 환축은 옆으로 쓰러져 전신 경련(Seizure)을 보이며 안락사까지 고려해야 할 만큼 극도로 위험한 상태였습니다. 무엇보다 스트레스 없이 빠르게 장 점막을 안정시키는 1초 펌프 긴급 조치가 절실했습니다.'",
        solution: "파보겔(Parvo Gel)은 주사기나 바늘 없이 입가에 살짝 대고 1초만 펌핑하면 꿀꺽 삼키는 혁신적인 액상 겔 제형입니다. 1-deoxinojirimycin 특허 성분과 고순도 몬모릴로나이트가 짓무른 장 점막에 물리적 실크 코팅막을 형성하여 병원성 독소를 즉시 흡착 배출합니다.",
        recovery: "투약 3일 만에 곡기를 끊었던 환축이 캔사료를 그릇까지 싹싹 핥아먹는 기적 같은 식욕 폭발을 보여주었습니다! 그리고 7일 차, 네 발로 씩씩하게 걸어서 최종 완치 퇴원 판정을 받았습니다."
      },
      monday: {
        title: "새벽에 아기 강아지가 피똥 싸고 쓰러졌을 때: 골든타임 72시간 대처법",
        p1: "생후 2~3개월령의 어린 자견은 체중이 1kg 미만으로 적고 면역계가 미완성되어, 단 몇 시간의 급성 설사만으로도 저혈당 쇼크와 탈수에 빠질 수 있습니다.",
        doctor: "김동준 원장: '바이러스성 장염은 장 점막 상피세포를 파괴하여 출혈성 설사를 유발합니다. 장 점막이 무너지면 체내 독소가 혈관으로 침투하므로 즉각적인 점막 물리적 보호가 핵심입니다.'",
        solution: "파보겔의 1-deoxinojirimycin 복합체는 바이러스 증식을 억제하고 장 점막에 밀착 코팅되어 2차 세균 감염을 차단합니다.",
        recovery: "병원 집중 케어와 파보겔 1초 투약 프로토콜을 통해 7일 만에 기적처럼 정상 컨디션으로 회복되었습니다."
      },
      wednesday: {
        title: "안락사 위기였던 0.6kg 아기 푸들이 스스로 네 발로 일어선 순간",
        p1: "옆으로 누워 전신을 떨던 55일령 토이푸들.. 모두가 가망이 없다고 생각했던 순간에 시작된 7일간의 치료 기록입니다.",
        doctor: "김동준 원장: '체온이 떨어지고 꼼짝도 못 하던 아이가 투약 이틀째부터 고개를 들고 스스로 철창을 짚고 일어서기 시작했습니다.'",
        solution: "파보겔의 포도당, 전해질 및 특허 유익균(Patent No. 2011B0042620.8)이 무너진 전해질 밸런스를 즉각 재건했습니다.",
        recovery: "네 발로 힘차게 서서 꼬리를 흔드는 모습에 보호자분과 진료실 의료진 모두 눈물을 흘렸습니다."
      }
    };

    function loadSelectedTheme() {
      const key = document.getElementById('themeSelect').value;
      const data = THEMES[key] || THEMES.tuesday;
      
      const html = `
        <div class="nb-title">${data.title}</div>
        
        <p>안녕하세요, 반려동물 건강 수호 파트너입니다.<br>
        오늘은 생후 55일령 초소형 아기 강아지(0.6kg)가 급성 장염과 전신 경련으로 긴급 내원하여, <b>단 7일 만에 기적처럼 완치되어 네 발로 뛰어 퇴원한 실제 임상 치료 사례</b>를 공유해 드립니다.</p>

        <div class="nb-h2">1. 아기 강아지 급성 장염과 골든타임</div>
        <p>${data.p1}</p>

        <div class="nb-quote">${data.doctor}</div>

        <div class="nb-media-placeholder">
          📹 [김동준 원장 진료실 초진 응급 발작 영상 배치 지점]
        </div>

        <div class="nb-h2">2. 주사기 스트레스 ZERO! 1초 펌프 급여의 혁신</div>
        <p>아픈 아이에게 억지로 주사기를 들이대면 기도로 넘어가 오연성 폐렴이 발생할 위험이 있습니다. <b>파보겔(Parvogel)</b>은 입가에 대고 1초만 누르면 스트레스 없이 자연스럽게 삼킵니다.</p>

        <div class="nb-h2">3. 과학적 치료 메커니즘: DNJ & 특허 복합체</div>
        <p>${data.solution}</p>

        <div class="nb-media-placeholder">
          📸 [파보겔 1초 펌핑 실물 및 성분 등록 증명서 배치 지점]
        </div>

        <div class="nb-h2">4. 3일 차 폭풍 완식 먹방 & 7일 차 완치 퇴원</div>
        <p>${data.recovery}</p>

        <div class="nb-media-placeholder">
          📹 [55일령 아기 강아지의 폭풍 캔사료 완식 먹방 영상 배치 지점]
        </div>

        <div class="nb-cta-box">
          <h3 style="color: #03C75A; font-size: 1.3rem; margin-bottom: 0.5rem;">🐾 파보겔 공식 구매처 안내 (익일 도착 보장)</h3>
          <p style="color: #475569; font-size: 0.95rem;">우리 아이의 골든타임을 지키는 가장 빠른 방법:</p>
          <a href="https://smartstore.naver.com/petschury/products/13718496355" target="_blank" class="nb-cta-btn">
            🟢 네이버 스마트스토어 (펫츄리 공식몰) 즉시 구매하기
          </a>
          <a href="https://www.coupang.com/vp/products/9690739565" target="_blank" class="nb-coupang-btn">
            🚀 쿠팡 로켓배송으로 내일 아침 즉시 받기
          </a>
        </div>
      `;

      document.getElementById('blogPreview').innerHTML = html;
    }

    function copyFormattedBlog() {
      const container = document.getElementById('blogPreview');
      const range = document.createRange();
      range.selectNodeContents(container);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      try {
        document.execCommand('copy');
        selection.removeAllRanges();
        showToast();
      } catch (err) {
        alert('복사에 실패했습니다. 수동으로 드래그하여 복사해 주세요.');
      }
    }

    function showToast() {
      const t = document.getElementById('toastMsg');
      t.style.display = 'block';
      setTimeout(() => {
        t.style.display = 'none';
      }, 3000);
    }

    // 초기 로드
    loadSelectedTheme();
  </script>
</body>
</html>
