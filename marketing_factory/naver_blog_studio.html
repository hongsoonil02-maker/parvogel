<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파보겔 네이버 블로그 스마트 에디터 원클릭 복사 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --naver-green: #03C75A;
      --naver-dark: #029f48;
      --coupang-red: #E61E2B;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .header {
      max-width: 900px;
      width: 100%;
      text-align: center;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-block;
      background: rgba(3, 199, 90, 0.15);
      color: var(--naver-green);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(3, 199, 90, 0.3);
    }

    .title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--subtext);
      font-size: 1rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: var(--card);
      border-radius: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.75rem;
      background: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .theme-select {
      background: #0f172a;
      color: #fff;
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.25rem;
      border-radius: 0.625rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-naver {
      background: var(--naver-green);
      color: #fff;
    }

    .btn-naver:hover {
      background: var(--naver-dark);
      transform: translateY(-1px);
    }

    .btn-naver:active {
      transform: translateY(0);
    }

    .btn-open {
      background: #334155;
      color: #f8fafc;
      text-decoration: none;
    }

    .btn-open:hover {
      background: #475569;
    }

    .editor-preview {
      padding: 2.5rem;
      background: #ffffff;
      color: #222222;
      line-height: 1.85;
      font-size: 1.05rem;
      overflow-y: auto;
      max-height: 680px;
    }

    /* 네이버 블로그 스마트에디터 스타일 완벽 재현 */
    .nb-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #111;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      letter-spacing: -0.03em;
      border-bottom: 2px solid #eee;
      padding-bottom: 1rem;
    }

    .nb-h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #03C75A;
      margin-top: 2rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nb-quote {
      background: #f8fafc;
      border-left: 4px solid #03C75A;
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0;
      border-radius: 0 0.5rem 0.5rem 0;
      font-size: 1.02rem;
      color: #334155;
      font-style: normal;
    }

    .nb-media-placeholder {
      background: #f1f5f9;
      border: 2px dashed #94a3b8;
      border-radius: 0.75rem;
      padding: 2rem;
      text-align: center;
      color: #475569;
      font-weight: 700;
      margin: 1.5rem 0;
    }

    .nb-cta-box {
      background: #f0fdf4;
      border: 2px solid #86efac;
      border-radius: 1rem;
      padding: 1.75rem;
      margin: 2rem 0;
    }

    .nb-cta-btn {
      display: block;
      background: #03C75A;
      color: #ffffff !important;
      text-align: center;
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 800;
      font-size: 1.15rem;
      text-decoration: none;
      margin-top: 1rem;
    }

    .nb-coupang-btn {
      display: block;
      background: #E61E2B;
      color: #ffffff !important;
      text-align: center;
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 800;
      font-size: 1.15rem;
      text-decoration: none;
      margin-top: 0.5rem;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      background: #03C75A;
      color: #fff;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      font-weight: 700;
      box-shadow: 0 10px 25px -5px rgba(3, 199, 90, 0.5);
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">NAVER BLOG AUTO-FORMATTER</div>
    <h1 class="title">파보겔 네이버 블로그 상위노출 원클릭 스튜디오</h1>
    <p class="subtitle">네이버 스마트에디터 ONE 서식과 100% 일치하도록 서식 복사하여 1초 만에 포스팅하세요.</p>
  </div>

  <div class="container">
    <div class="action-bar">
      <select class="theme-select" id="themeSelect" onchange="loadSelectedTheme()">
        <option value="copy-a">✨ [임상실화] 7일간의 기적 (설사·혈변 쓰러졌던 아이 3일 만에 완식)</option>
        <option value="copy-b">🚨 [응급상비] 24시간 안심 응급 (병원 문 닫은 새벽 골든타임 1초)</option>
        <option value="copy-c">🩺 [수의사고백] 48시간 단독 처방 (수액·독한 약 없이 오직 파보겔 회복)</option>
        <option value="copy-d">🌿 [간편급여] 스트레스 0% 1초 쏙 (주사기 거품 물림 없이 스스로 완식)</option>
        <option value="livestock">🐮 [축산농가] 송아지·자돈 수양성 설사 24시간 내 정상화</option>
        <option value="custom">✍️ [매장맞춤] 취급점·도매점 직접 입력 카피 연동</option>
      </select>

      <div class="btn-group">
        <button class="btn btn-naver" onclick="copyFormattedBlog()">
          📋 스마트에디터 서식 원클릭 복사
        </button>
        <a href="https://section.blog.naver.com/" target="_blank" class="btn btn-open" title="네이버 블로그 홈에서 [글쓰기]를 클릭하세요">
          ✏️ 네이버 블로그 열기 (글쓰기)
        </a>
      </div>
    </div>

    <div class="editor-preview" id="blogPreview">
      <!-- 동적 콘텐츠 로드 -->
    </div>
  </div>

  <div class="toast" id="toastMsg">✅ 서식이 클립보드에 복사되었습니다! 네이버 블로그에 Ctrl+V 하세요.</div>

  <script>
    const THEMES = {
      "copy-a": {
        badge: "✨ 7일간의 기적 임상 실화",
        title: "설사·혈변으로 곡기 끊겨 쓰러졌던 아이, 단 3일 만에 밥그릇 싹싹 비워내고 다시 일어섭니다",
        p1: "급성 장염과 혈변으로 기운을 잃고 쓰러진 아기 강아지.. 지푸라기라도 잡고 싶은 보호자의 절박한 심정 앞에서 골든타임 72시간의 대처가 생사를 가릅니다.",
        doctor: "하남 사랑동물병원 김동준 원장: '내원 당시 55일령 0.6kg 환축은 스스로 고개도 가누지 못하는 상태였습니다. 기타 처방과 수액을 일체 배제하고 오직 파보겔 단독 급여만으로 48시간 만에 장 점막 안정과 놀라운 회복을 이끌어냈습니다.'",
        solution: "파보겔(Parvo Gel)은 고순도 몬모릴로나이트와 1-deoxinojirimycin 특허 성분이 짓무른 장 점막에 물리적 실크 코팅막을 형성하여 병원성 바이러스 독소를 즉시 흡착 배출합니다.",
        recovery: "투약 3일 만에 곡기를 끊었던 환축이 캔사료를 그릇까지 싹싹 핥아먹는 기적 같은 식욕 폭발을 보여주었으며, 7일 차에 네 발로 힘차게 걸어서 완치 퇴원 판정을 받았습니다."
      },
      "copy-b": {
        badge: "🚨 24시간 안심 응급 상비약",
        title: "병원 문 닫은 새벽 갑작스런 구토와 물설사, 엄마가 건넬 수 있는 가장 빠른 1초",
        p1: "불 꺼진 새벽, 갑자기 시작된 분수토와 물설사로 바들바들 떠는 아이를 보며 발만 동동 굴렀던 경험이 있으신가요? 24시간 응급 병원이 멀리 있을 때 즉각적인 응급 조치가 아이의 생명을 지킵니다.",
        doctor: "김동준 원장: '어린 자견은 체중이 적어 단 몇 시간의 급성 설사만으로도 급속한 탈수와 저혈당 쇼크에 빠집니다. 병원에 데려가는 동안이라도 장 점막을 즉시 물리적으로 감싸줄 수 있는 상비약이 필수적입니다.'",
        solution: "파보겔은 주사기나 바늘 없이 입가에 대고 1초만 펌핑하면 꿀꺽 삼키는 안전한 액상 겔입니다. 체내 전해질 밸런스를 신속히 보충하고 유해균 증식을 억제합니다.",
        recovery: "새벽 위기를 무사히 넘긴 아이들은 장내 환경이 안정되어 구토가 멎고 빠르게 편안한 호흡을 되찾습니다."
      },
      "copy-c": {
        badge: "🩺 수의사 진료실 고백 실화",
        title: "안락사 위기의 55일령 아기 푸들, 수액도 독한 약도 없이 오직 파보겔 하나로 일어섰습니다",
        p1: "옆으로 누워 전신을 떨며 경련(Seizure)을 하던 0.6kg 아기 강아지.. 너무 작아서 혈관에 수액 바늘조차 꽂기 힘들었던 절체절명의 순간이었습니다.",
        doctor: "김동준 원장 단독 처방 팩트: '첫 48시간 동안 기타 수액 처치나 항생제 투약을 일체 하지 않았습니다. 오직 파보겔 단독 투약만으로 이 극적인 활력 회복을 이끌어냈기에, 제품 자체의 독립적인 약리적 효능을 확신하게 되었습니다.'",
        solution: "1-deoxinojirimycin 복합체와 Patent No. 2011B0042620.8 특허 유익균이 장 점막 상피세포를 보호하며 무너진 장벽을 과학적으로 재건했습니다.",
        recovery: "이틀째부터 스스로 네 발로 일어나 철창을 짚고 반응하더니, 7일 만에 기적처럼 완벽 퇴원했습니다."
      },
      "copy-d": {
        badge: "🌿 스트레스 0% 간편 급여",
        title: "약 먹이기 전쟁은 이제 끝! 주사기 거품 토해냄 없이 1초 만에 쏙 스스로 맛있게 핥아먹습니다",
        p1: "아픈 아이를 붙잡고 강제로 주사기를 찔러 넣다 거품을 토하거나 기도로 넘어가 켁켁거릴 때, 먹이는 사람도 먹는 아이도 극심한 트라우마를 겪습니다.",
        doctor: "김동준 원장: '약 먹이는 스트레스 자체가 환축의 심박수와 체온을 교란합니다. 파보겔은 원터치 펌프형 용기로 입술만 살짝 들어 올려 1초 펌핑하면 끝납니다.'",
        solution: "초미세 나노 공정으로 흡수와 흡착은 빠르게, 아이들이 거부감 없이 자발적으로 핥아먹는 부드러운 기호성 겔 제형을 완성했습니다.",
        recovery: "스트레스 제로 급여로 탈진한 아이도 편안하게 삼키고 위장관이 즉각 안정됩니다."
      },
      "livestock": {
        badge: "🐮 축산·농가 안심 솔루션",
        title: "신생 송아지·자돈 급성 수양성 설사, 24시간 내 빠른 분변 정상화로 폐사율 80% 저감",
        p1: "초유 섭취 후 1~3주령 송아지에서 발생하는 로타/코로나/파보성 수양성 설사는 축산 농가의 가장 큰 경제적 피해 요인입니다.",
        doctor: "엠오바이오(MOBIO) 총판 기술고문: '전해질 투여만으로는 손상된 점막과 내독소를 막기 어렵습니다. 대용량 500ml 원터치 펌프로 구강 내 3초 직투여하여 조기 기립을 유도합니다.'",
        solution: "강력한 엔도톡신 흡착 배출과 장 점막 코팅으로 탈락된 상피세포를 빠르게 안정화시킵니다.",
        recovery: "설사가 멎고 젖을 빠는 힘이 되살아나 송아지 폐사를 선제적으로 방어합니다."
      },
      "custom": {
        badge: "✍️ 우리 매장 단골 맞춤 카피",
        title: "지역 주민과 단골 고객을 위한 파보겔 공식 취급점 특별 안내",
        p1: "갑작스런 반려동물의 구토와 설사, 멀리 가실 필요 없이 우리 동네 공식 취급점에서 즉시 만나보실 수 있습니다.",
        doctor: "공식 취급 동물약국/병원 원장님 추천: '위급할 때 가장 먼저 손이 가는 1초 펌프 상비약, 우리 아이를 위해 상비해 두세요.'",
        solution: "특허 복합 성분과 고순도 몬모릴로나이트의 즉각적인 장 점막 코팅 효과.",
        recovery: "우리 동네 아이들의 건강한 활력을 지키는 든든한 이웃이 되겠습니다."
      }
    };

    function loadSelectedTheme() {
      const key = document.getElementById('themeSelect').value;
      let data = THEMES[key] || THEMES["copy-a"];
      
      if (key === 'custom') {
        const savedCustom = localStorage.getItem('parvogel_partner_custom_copy');
        if (savedCustom) {
          const parts = savedCustom.split(/[|\n]/).map(s => s.trim()).filter(Boolean);
          if (parts.length >= 3) {
            data = {
              ...data,
              badge: parts[0],
              title: `${parts[1]} — ${parts[2]}`,
              p1: `우리 매장 단골 보호자님들을 위한 맞춤 안내: ${parts[1]}`,
              recovery: parts[2]
            };
          }
        }
      }
      
      const html = `
        <div style="display:inline-block; background:#eff6ff; color:#1d4ed8; padding:4px 12px; border-radius:99px; font-size:12px; font-weight:800; border:1px solid #bfdbfe; margin-bottom:12px;">
          ${data.badge}
        </div>
        <div class="nb-title">${data.title}</div>
        
        <p>안녕하세요, 반려동물 건강 수호 파트너입니다.<br>
        오늘은 생후 55일령 초소형 아기 강아지(0.6kg)가 급성 장염과 전신 경련으로 긴급 내원하여, <b>단 7일 만에 기적처럼 완치되어 네 발로 뛰어 퇴원한 실제 임상 치료 사례</b>를 공유해 드립니다.</p>

        <div class="nb-h2">1. 아기 강아지 급성 장염과 골든타임</div>
        <p>${data.p1}</p>

        <div class="nb-quote">${data.doctor}</div>

        <div class="nb-media-placeholder">
          📹 [김동준 원장 진료실 초진 응급 발작 영상 배치 지점]
        </div>

    function copyFormattedBlog() {
      const container = document.getElementById('blogPreview');
      const range = document.createRange();
      range.selectNodeContents(container);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);

      try {
        document.execCommand('copy');
        selection.removeAllRanges();
        showToast();
      } catch (err) {
        alert('복사에 실패했습니다. 수동으로 드래그하여 복사해 주세요.');
      }
    }

    function showToast() {
      const t = document.getElementById('toastMsg');
      t.style.display = 'block';
      setTimeout(() => {
        t.style.display = 'none';
      }, 3000);
    }
