<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>100Bagger Auto Publisher</title>
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 15px; margin: 0; color: #1e293b; }
    h2 { font-size: 16px; margin-top: 0; color: #03C75A; display: flex; align-items: center; gap: 6px; }
    .status-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; font-size: 13px; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-on { background: #dcfce7; color: #166534; }
    .input-group { margin-bottom: 10px; }
    label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    button { width: 100%; background: #03C75A; color: white; border: none; padding: 9px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { background: #02b150; }
  </style>
</head>
<body>
  <h2>🚀 100Bagger Worker</h2>
  <div class="status-box">
    <div>상태: <span id="statusBadge" class="badge badge-on">연결 활성화</span></div>
    <div style="margin-top: 6px; color: #64748b; font-size: 11.5px;">네이버 로그인 세션 기반 무제재 자동 발행기</div>
  </div>
  <div class="input-group">
    <label>백엔드 Queue API 엔드포인트</label>
    <input type="text" id="apiUrl" value="http://localhost:8000/api/marketing/queue" />
  </div>
  <button id="saveBtn">설정 저장 및 즉시 큐 확인</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      chrome.storage.local.get(['config'], (res) => {
        if (res.config && res.config.apiUrl) {
          document.getElementById('apiUrl').value = res.config.apiUrl;
        }
      });
      document.getElementById('saveBtn').addEventListener('click', () => {
        const url = document.getElementById('apiUrl').value.trim();
        chrome.storage.local.set({
          config: { apiUrl: url, pollIntervalMinutes: 5, isActive: true }
        }, () => {
          alert('설정이 저장되었습니다. 큐 동기화를 시작합니다.');
        });
      });
    });
  </script>
</body>
</html>
